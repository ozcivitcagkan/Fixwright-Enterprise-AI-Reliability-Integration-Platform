name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixwright
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fixwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixwright"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fixwright
      DB_USER: fixwright
      DB_PASSWORD: ci_only_password
      TEST_DB_NAME: fixwright_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v